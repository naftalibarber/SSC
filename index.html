<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>SSC (Super Speed Cube)</title><link rel="icon" type="image/png" href="./ssc-logo.png"><link rel="apple-touch-icon" href="./ssc-logo.png"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Alef:wght@400;700&family=Assistant:wght@300;400;500;600;700;800&family=Heebo:wght@300;400;500;600;700;800&family=Noto+Sans+Hebrew:wght@300;400;500;600;700;800&family=Rubik:wght@300;400;500;600;700;800&family=Audiowide&family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@400;500;600;700;800&family=Oxanium:wght@400;500;600;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet"><link rel="stylesheet" href="./code/css/styles.css?v=20260824-5"><link rel="stylesheet" href="./code/css/button-accent-overrides.css?v=20260824-4"><link rel="stylesheet" href="./code/css/layout-fix.css?v=20260824-4"><link rel="stylesheet" href="./code/css/hebrew-ui-fixes.css?v=20260824-4"><link id="minimalCompetitionStylesheet" rel="stylesheet" href="./code/css/minimal-competition.css?v=20260824-1"><link rel="stylesheet" href="./code/css/version-switch.css?v=20260824-1"><link data-ssc-cube-preview-style rel="stylesheet" href="./code/css/cube-preview.css?v=20260824-5"><link rel="stylesheet" href="./code/css/wca-previews.css?v=20260824-3"><link rel="stylesheet" href="./code/css/puzzle-3d.css?v=20260824-1"><link rel="stylesheet" href="./code/css/event-selector.css?v=20260824-1"><script src="https://cdn.cubing.net/v0/js/scramble-display" type="module"></script><script src="https://cdn.cubing.net/v0/js/cubing/twisty" type="module"></script><style>#timer{font-family:var(--timer-font,var(--app-font))!important}#importExportButton svg,#deleteSession svg,#addSession svg{display:block!important;width:18px;height:18px;flex:0 0 auto;stroke:currentColor!important}.cube-colors-control{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.cube-color-item{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:7px;border:1px solid var(--border);border-radius:8px}.cube-color-item input{width:34px;height:28px;border:0;padding:0;background:none}.cube-colors-reset{grid-column:1/-1;border:1px solid var(--border);background:var(--soft);color:var(--text);border-radius:8px;padding:8px;cursor:pointer}</style></head><body>
<button id="languageToggle" type="button" hidden>English</button>
<main class="shell"><header class="topbar compact-bar"><div class="topbar-side topbar-start"><button id="generalSettingsButton" class="toolbar-button" type="button" aria-label="הגדרות כלליות"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg><span>SETTINGS</span></button><button id="importExportButton" class="toolbar-button" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 7h10m-3-3 3 3-3 3M17 17H7m3-3-3 3 3 3"/></svg><span>IMPORT / EXPORT</span></button><button id="versionSwitchButton" type="button" aria-pressed="true"><span class="version-switch-label">לגרסה הקודמת</span></button></div><div class="topbar-center"><div class="event-select-wrap"><select id="eventSelect" class="event-select" aria-label="בחירת מקצה"></select><div class="puzzle-selector compact"><button class="puzzle-btn active" type="button" data-puzzle="3x3">3×3</button><button class="puzzle-btn" type="button" data-puzzle="2x2">2×2</button></div></div><div class="session-toolbar"><select id="sessionSelect" class="session-select top-session"></select><button id="addSession" class="icon-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg></button><button id="deleteSession" class="icon-btn" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6M10 10v6M14 10v6"/></svg></button></div></div><div class="topbar-side topbar-end"><a class="brand-link" href="https://naftalibarber.github.io/SSC/"><img class="site-logo small-logo" src="./ssc-logo.png?v=20260824-5" alt="SSC"></a></div></header>
<section class="scramble-bar"><button id="prevScramble" class="scramble-nav" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></button><div class="scramble-center"><div id="scrambleLabel" class="scramble-title"></div><div id="scramble"></div></div><div class="scramble-side"><button id="newScramble" class="scramble-nav" type="button"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m9 18 6-6-6-6"/></svg></button><div id="cubePreview2D" class="cube-preview-card" aria-live="polite"></div></div></section>
<div class="workspace cstimer-layout"><aside class="history-panel flat-panel"><section class="stats-section"><div class="section-title">STATISTICS</div><div id="statsGrid" class="stats-grid"></div></section><section class="times-section"><div class="history-section-head"><span>TIMES</span><strong id="solveCount">0</strong></div><div id="emptyHistory" class="empty-history"></div><div id="historyList" class="history-list" hidden></div></section><button id="historySettingsButton" class="history-settings-link" type="button">הגדרות היסטוריה</button><div id="historySettings" class="history-settings" hidden><div class="settings-title"></div><div id="historyMetricOptions" class="metric-options"></div><div class="custom-ao-row"><label for="customAoInput">Ao</label><input id="customAoInput" type="number" min="3" max="100000"><button id="addCustomAo" class="small-btn" type="button">הוסף</button></div><button id="clearHistory" class="clear-history-flat" type="button">מחק היסטוריה</button></div></aside><section class="timer-card flat-timer"><div class="timer-wrap"><div><div id="timer">0.000</div><div id="status"></div><div class="quick-stats"><div><span>AO5</span><strong id="quickAo5">—</strong></div><div><span>AO12</span><strong id="quickAo12">—</strong></div></div></div></div><button id="touchTimer" class="btn" type="button"></button></section></div></main>
<div id="generalSettingsModal" class="settings-modal" hidden><div class="settings-backdrop" data-close-settings></div><section class="settings-dialog"><div class="settings-dialog-head"><h2 id="generalSettingsTitle">הגדרות כלליות</h2><button id="closeGeneralSettings" class="modal-close" type="button">×</button></div><div class="general-settings-grid"><label class="general-setting-row"><span id="languageSettingLabel">שפה</span><select id="languageSelect"><option value="he">עברית</option><option value="en">English</option></select></label><label class="general-setting-row"><span id="textSizeSettingLabel">גודל הטקסט</span><div class="range-control"><input id="textSizeRange" type="range" min="85" max="125" step="5"><output id="textSizeValue">100%</output></div></label><label class="general-setting-row"><span id="fontSettingLabel">גופן הטקסט</span><select id="fontSelect"></select></label><label class="general-setting-row"><span id="timerFontSettingLabel">גופן הטיימר</span><select id="timerFontSelect"></select></label><label class="general-setting-row"><span id="timePrecisionSettingLabel">דיוק הזמן</span><select id="timePrecisionSelect"><option value="3">0.000</option><option value="2">0.00</option></select></label><label class="general-setting-row"><span id="primaryColorSettingLabel">צבע ראשי</span><div class="color-control"><input id="primaryColorInput" type="color" value="#2563eb"><output id="primaryColorValue">#2563EB</output><button id="resetPrimaryColor" type="button">איפוס</button></div></label><div class="general-setting-row"><span id="cubeColorsSettingLabel">צבעי הקובייה</span><div id="cubeColorsControl" class="cube-colors-control"><label class="cube-color-item"><span id="cubeWhiteLabel">לבן</span><input type="color" data-cube-face="U"></label><label class="cube-color-item"><span id="cubeYellowLabel">צהוב</span><input type="color" data-cube-face="D"></label><label class="cube-color-item"><span id="cubeGreenLabel">ירוק</span><input type="color" data-cube-face="F"></label><label class="cube-color-item"><span id="cubeBlueLabel">כחול</span><input type="color" data-cube-face="B"></label><label class="cube-color-item"><span id="cubeRedLabel">אדום</span><input type="color" data-cube-face="R"></label><label class="cube-color-item"><span id="cubeOrangeLabel">כתום</span><input type="color" data-cube-face="L"></label><button id="resetCubeColors" class="cube-colors-reset" type="button">איפוס צבעי קובייה</button></div></div><div class="general-setting-row theme-row"><span id="themeSettingLabel">עיצוב</span><div class="theme-options"><button id="themeLightButton" type="button" data-theme-choice="light">בהיר</button><button id="themeDarkButton" type="button" data-theme-choice="dark">כהה</button><button type="button" data-theme-choice="oled">OLED</button></div></div></div></section></div>
<div id="importExportModal" class="settings-modal" hidden><div class="settings-backdrop" data-close-import-export></div><section class="settings-dialog"><div class="settings-dialog-head"><h2>יבוא / יצוא</h2><button id="closeImportExport" class="modal-close" type="button">×</button></div><div class="import-export-grid"><button id="exportData" class="toolbar-button wide" type="button">יצוא נתונים</button><label class="toolbar-button wide file-label">יבוא נתונים<input id="importData" type="file" accept="application/json,.json" hidden></label><p id="importExportStatus"></p></div></section></div>
