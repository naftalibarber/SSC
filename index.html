<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSC (Super Speed Cube)</title>
  <link rel="icon" type="image/png" href="./ssc-logo.png">
  <link rel="apple-touch-icon" href="./ssc-logo.png">
  <link rel="stylesheet" href="./code/css/styles.css?v=20260824-4">
  <link rel="stylesheet" href="./code/css/button-accent-overrides.css?v=20260824-4">
  <link rel="stylesheet" href="./code/css/layout-fix.css?v=20260824-4">
  <link rel="stylesheet" href="./code/css/hebrew-ui-fixes.css?v=20260824-4">
  <link id="minimalCompetitionStylesheet" rel="stylesheet" href="./code/css/minimal-competition.css?v=20260824-1">
  <link rel="stylesheet" href="./code/css/version-switch.css?v=20260824-1">
  <style>
    @font-face{font-family:'SSC Rubik';src:local('Rubik'),local('Rubik Regular');font-style:normal;font-weight:100 900;font-display:swap}
    @font-face{font-family:'SSC Assistant';src:local('Assistant'),local('Assistant Regular');font-style:normal;font-weight:200 800;font-display:swap}
  </style>
</head>
<body>
  <button id="languageToggle" type="button" hidden>English</button>
  <main class="shell">
    <header class="topbar compact-bar">
      <div class="topbar-side topbar-start">
        <button id="generalSettingsButton" class="toolbar-button" type="button" aria-label="הגדרות כלליות" title="הגדרות כלליות"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7"/><path d="M4 10V3"/><path d="M12 21v-9"/><path d="M12 8V3"/><path d="M20 21v-5"/><path d="M20 12V3"/><path d="M1 14h6"/><path d="M9 8h6"/><path d="M17 16h6"/></svg> <span>SETTINGS</span></button>
        <button id="importExportButton" class="toolbar-button" type="button" aria-label="יבוא / יצוא" title="יבוא / יצוא"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m17 3 4 4-4 4"/><path d="M3 7h18"/><path d="m7 21-4-4 4-4"/><path d="M21 17H3"/></svg> <span>IMPORT / EXPORT</span></button>
        <button id="versionSwitchButton" type="button" aria-label="לגרסה הקודמת" title="לגרסה הקודמת" aria-pressed="true"><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 7h11l-3-3"/><path d="m19 7-3 3"/><path d="M16 17H5l3 3"/><path d="m5 17 3-3"/></svg><span class="version-switch-label">לגרסה הקודמת</span></button>
      </div>
      <div class="topbar-center">
        <div class="event-select-wrap"><span class="eyebrow-inline">EVENT</span><div class="puzzle-selector compact" aria-label="בחירת קובייה" data-i18n-aria="puzzleSelectorAria"><button class="puzzle-btn active" type="button" data-puzzle="3x3">3×3</button><button class="puzzle-btn" type="button" data-puzzle="2x2">2×2</button></div></div>
        <div class="session-toolbar"><select id="sessionSelect" class="session-select top-session" aria-label="בחירת סשן" data-i18n-aria="sessionSelectAria"></select><button id="addSession" class="icon-btn" type="button" title="הוסף סשן" aria-label="הוסף סשן"><svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8"/><path d="M8 12h8"/></svg></button><button id="deleteSession" class="icon-btn" type="button" title="מחק סשן" aria-label="מחק סשן"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v5"/><path d="M14 11v5"/></svg></button></div>
      </div>
      <div class="topbar-side topbar-end"><a class="brand-link" href="https://naftalibarber.github.io/SSC/" aria-label="SSC - Super Speed Cube"><img class="site-logo small-logo" src="./ssc-logo.png?v=20260824-5" alt="SSC - Super Speed Cube"></a></div>
    </header>
    <section class="scramble-bar" aria-label="ערבוב"><button id="prevScramble" class="scramble-nav" type="button" aria-label="ערבוב קודם"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button><div class="scramble-center"><div id="scrambleLabel" class="scramble-title"></div><div id="scramble" aria-live="polite"></div></div><button id="newScramble" class="scramble-nav" type="button" aria-label="ערבוב חדש"><svg aria-hidden="true" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button></section>
    <div class="workspace cstimer-layout">
      <aside class="history-panel flat-panel" aria-label="היסטוריה וסטטיסטיקות" data-i18n-aria="historyAria"><section class="stats-section"><div class="section-title">STATISTICS</div><div id="statsGrid" class="stats-grid"></div></section><section class="times-section"><div class="history-section-head"><span>TIMES</span><strong id="solveCount">0</strong></div><div id="emptyHistory" class="empty-history" data-i18n="emptyHistory"></div><div id="historyList" class="history-list" hidden></div></section><button id="historySettingsButton" class="history-settings-link" type="button" data-i18n="historySettings">הגדרות היסטוריה</button><div id="historySettings" class="history-settings" hidden><div class="settings-title" data-i18n="historySettingsTitle"></div><div id="historyMetricOptions" class="metric-options"></div><div class="custom-ao-row"><label for="customAoInput" data-i18n="customAo"></label><input id="customAoInput" type="number" min="3" max="100000" step="1" inputmode="numeric" placeholder="75"><button id="addCustomAo" class="small-btn" type="button" data-i18n="add"></button></div><button id="clearHistory" class="clear-history-flat" type="button" data-i18n="clearHistory"></button></div></aside>
      <section class="timer-card flat-timer" aria-label="טיימר" data-i18n-aria="timerAria"><div class="timer-wrap"><div><div id="timer">0.000</div><div id="status"></div><div class="quick-stats"><div><span>AO5</span><strong id="quickAo5">—</strong></div><div><span>AO12</span><strong id="quickAo12">—</strong></div></div></div></div><button id="touchTimer" class="btn" type="button" data-i18n="holdHere"></button></section>
    </div>
  </main>
  <div id="generalSettingsModal" class="settings-modal" hidden><div class="settings-backdrop" data-close-settings></div><section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="generalSettingsTitle"><div class="settings-dialog-head"><h2 id="generalSettingsTitle">הגדרות כלליות</h2><button id="closeGeneralSettings" class="modal-close" type="button" aria-label="סגור"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div class="general-settings-grid"><label class="general-setting-row"><span id="languageSettingLabel">שפה</span><select id="languageSelect"><option value="he">עברית</option><option value="en">English</option></select></label><label class="general-setting-row"><span id="textSizeSettingLabel">גודל הטקסט</span><div class="range-control"><input id="textSizeRange" type="range" min="85" max="125" step="5"><output id="textSizeValue">100%</output></div></label><label class="general-setting-row"><span id="fontSettingLabel">גופן הטקסט</span><select id="fontSelect"><option value="Arial">Arial</option><option value="Rubik">Rubik</option><option value="Assistant">Assistant</option><option value="system">System / Segoe UI</option><option value="Verdana">Verdana</option><option value="Georgia">Georgia</option><option value="Courier">Courier New</option></select></label><label class="general-setting-row"><span id="primaryColorSettingLabel">צבע ראשי</span><div class="color-control"><input id="primaryColorInput" type="color" value="#2563eb"><output id="primaryColorValue">#2563EB</output><button id="resetPrimaryColor" type="button">איפוס</button></div></label><div class="general-setting-row theme-row"><span id="themeSettingLabel">עיצוב</span><div class="theme-options"><button id="themeLightButton" type="button" data-theme-choice="light">בהיר</button><button id="themeDarkButton" type="button" data-theme-choice="dark">כהה</button><button type="button" data-theme-choice="oled">OLED</button></div></div></div></section></div>
  <div id="importExportModal" class="settings-modal" hidden><div class="settings-backdrop" data-close-import-export></div><section class="settings-dialog import-export-dialog" role="dialog" aria-modal="true"><div class="settings-dialog-head"><h2>יבוא / יצוא</h2><button id="closeImportExport" class="modal-close" type="button" aria-label="סגור"><svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button></div><div class="import-export-grid"><button id="exportData" class="toolbar-button wide" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg> <span>יצוא נתונים</span></button><label class="toolbar-button wide file-label"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21V9"/><path d="m7 14 5-5 5 5"/><path d="M5 3h14"/></svg> <span>יבוא נתונים</span><input id="importData" type="file" accept="application/json,.json" hidden></label><p id="importExportStatus" class="import-export-status"></p></div></section></div>
  <script src="./code/js/cube2x2.js?v=20260824-4"></script><script src="./code/js/scramble2x2.js?v=20260824-4"></script><script src="./code/js/app.js?v=20260824-4"></script><script src="./code/js/scramble-history.js?v=20260824-1"></script><script src="./code/js/settings.js?v=20260824-5"></script><script src="./code/js/import-export.js?v=20260824-4"></script><script src="./code/js/hebrew-i18n-fixes.js?v=20260824-4"></script><script src="./code/js/version-switch.js?v=20260824-1"></script>
</body></html>
