<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SSC (Super Speed Cube)</title>
  <link rel="icon" type="image/png" href="./ssc-logo.png">
  <link rel="apple-touch-icon" href="./ssc-logo.png">
  <link rel="stylesheet" href="./code/css/styles.css?v=20260824-4">
  <link rel="stylesheet" href="./code/css/button-accent-overrides.css?v=20260824-4">
  <link rel="stylesheet" href="./code/css/layout-fix.css?v=20260824-4">
  <link rel="stylesheet" href="./code/css/hebrew-ui-fixes.css?v=20260824-4">
</head>
<body>
  <button id="languageToggle" type="button" hidden>English</button>
  <main class="shell">
    <header class="topbar compact-bar">
      <div class="topbar-side topbar-start">
        <button id="generalSettingsButton" class="toolbar-button" type="button" aria-label="הגדרות כלליות" title="הגדרות כלליות"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .34 1.88l.06.06-2.83 2.83-.06-.06A1.7 1.7 0 0 0 15 19.4a1.7 1.7 0 0 0-1 .6 1.7 1.7 0 0 0-.4 1.1V21h-4v-.1A1.7 1.7 0 0 0 8.6 19.4a1.7 1.7 0 0 0-1.88.34l-.06.06-2.83-2.83.06-.06A1.7 1.7 0 0 0 4.6 15a1.7 1.7 0 0 0-.6-1 1.7 1.7 0 0 0-1.1-.4H3v-4h.1A1.7 1.7 0 0 0 4.6 8.6a1.7 1.7 0 0 0-.34-1.88l-.06-.06 2.83-2.83.06.06A1.7 1.7 0 0 0 9 4.6a1.7 1.7 0 0 0 1-.6 1.7 1.7 0 0 0 .4-1.1V3h4v.1A1.7 1.7 0 0 0 15.4 4.6a1.7 1.7 0 0 0 1.88-.34l.06-.06 2.83 2.83-.06.06A1.7 1.7 0 0 0 19.4 9c.14.37.35.7.6 1 .28.3.67.46 1.1.46h.1v4h-.1c-.43 0-.82.16-1.1.46-.25.29-.46.62-.6 1.08z"/></svg> <span>SETTINGS</span></button>
        <button id="importExportButton" class="toolbar-button" type="button" aria-label="יבוא / יצוא" title="יבוא / יצוא"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h11l-3-3m3 3-3 3M17 17H6l3 3m-3-3 3-3"/></svg> <span>IMPORT / EXPORT</span></button>
      </div>
      <div class="topbar-center">
        <div class="event-select-wrap"><span class="eyebrow-inline">EVENT</span><div class="puzzle-selector compact" aria-label="בחירת קובייה" data-i18n-aria="puzzleSelectorAria"><button class="puzzle-btn active" type="button" data-puzzle="3x3">3×3</button><button class="puzzle-btn" type="button" data-puzzle="2x2">2×2</button></div></div>
        <div class="session-toolbar"><select id="sessionSelect" class="session-select top-session" aria-label="בחירת סשן" data-i18n-aria="sessionSelectAria"></select><button id="addSession" class="icon-btn" type="button" title="הוסף סשן" aria-label="הוסף סשן"><svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button><button id="deleteSession" class="icon-btn" type="button" title="מחק סשן" aria-label="מחק סשן"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6.5 7l1 13h9l1-13M10 11v5M14 11v5"/></svg></button></div>
      </div>
      <div class="topbar-side topbar-end"><a class="brand-link" href="https://naftalibarber.github.io/SSC/" aria-label="SSC - Super Speed Cube"><img class="site-logo small-logo" src="./ssc-logo.png?v=20260824-5" alt="SSC - Super Speed Cube"></a></div>
    </header>
    <section class="scramble-bar" aria-label="ערבוב"><button id="prevScramble" class="scramble-nav" type="button" aria-label="ערבוב קודם">‹</button><div class="scramble-center"><div id="scrambleLabel" class="scramble-title"></div><div id="scramble" aria-live="polite"></div></div><button id="newScramble" class="scramble-nav" type="button" aria-label="ערבוב חדש">›</button></section>
    <div class="workspace cstimer-layout">
      <aside class="history-panel flat-panel" aria-label="היסטוריה וסטטיסטיקות" data-i18n-aria="historyAria"><section class="stats-section"><div class="section-title">STATISTICS</div><div id="statsGrid" class="stats-grid"></div></section><section class="times-section"><div class="history-section-head"><span>TIMES</span><strong id="solveCount">0</strong></div><div id="emptyHistory" class="empty-history" data-i18n="emptyHistory"></div><div id="historyList" class="history-list" hidden></div></section><button id="historySettingsButton" class="history-settings-link" type="button" data-i18n="historySettings">הגדרות היסטוריה</button><div id="historySettings" class="history-settings" hidden><div class="settings-title" data-i18n="historySettingsTitle"></div><div id="historyMetricOptions" class="metric-options"></div><div class="custom-ao-row"><label for="customAoInput" data-i18n="customAo"></label><input id="customAoInput" type="number" min="3" max="100000" step="1" inputmode="numeric" placeholder="75"><button id="addCustomAo" class="small-btn" type="button" data-i18n="add"></button></div><button id="clearHistory" class="clear-history-flat" type="button" data-i18n="clearHistory"></button></div></aside>
      <section class="timer-card flat-timer" aria-label="טיימר" data-i18n-aria="timerAria"><div class="timer-wrap"><div><div id="timer">0.000</div><div id="status"></div><div class="quick-stats"><div><span>AO5</span><strong id="quickAo5">—</strong></div><div><span>AO12</span><strong id="quickAo12">—</strong></div></div></div></div><button id="touchTimer" class="btn" type="button" data-i18n="holdHere"></button></section>
    </div>
  </main>
  <div id="generalSettingsModal" class="settings-modal" hidden><div class="settings-backdrop" data-close-settings></div><section class="settings-dialog" role="dialog" aria-modal="true" aria-labelledby="generalSettingsTitle"><div class="settings-dialog-head"><h2 id="generalSettingsTitle">הגדרות כלליות</h2><button id="closeGeneralSettings" class="modal-close" type="button" aria-label="סגור">×</button></div><div class="general-settings-grid"><label class="general-setting-row"><span id="languageSettingLabel">שפה</span><select id="languageSelect"><option value="he">עברית</option><option value="en">English</option></select></label><label class="general-setting-row"><span id="textSizeSettingLabel">גודל הטקסט</span><div class="range-control"><input id="textSizeRange" type="range" min="85" max="125" step="5"><output id="textSizeValue">100%</output></div></label><label class="general-setting-row"><span id="fontSettingLabel">גופן הטקסט</span><select id="fontSelect"><option value="Arial">Arial</option><option value="Rubik">Rubik</option><option value="Assistant">Assistant</option><option value="system">System</option><option value="Verdana">Verdana</option></select></label><label class="general-setting-row"><span id="primaryColorSettingLabel">צבע ראשי</span><div class="color-control"><input id="primaryColorInput" type="color" value="#2563eb"><output id="primaryColorValue">#2563EB</output><button id="resetPrimaryColor" type="button">איפוס</button></div></label><div class="general-setting-row theme-row"><span id="themeSettingLabel">עיצוב</span><div class="theme-options"><button id="themeLightButton" type="button" data-theme-choice="light">בהיר</button><button id="themeDarkButton" type="button" data-theme-choice="dark">כהה</button><button type="button" data-theme-choice="oled">OLED</button></div></div></div></section></div>
  <div id="importExportModal" class="settings-modal" hidden><div class="settings-backdrop" data-close-import-export></div><section class="settings-dialog import-export-dialog" role="dialog" aria-modal="true"><div class="settings-dialog-head"><h2>יבוא / יצוא</h2><button id="closeImportExport" class="modal-close" type="button" aria-label="סגור">×</button></div><div class="import-export-grid"><button id="exportData" class="toolbar-button wide" type="button"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12m0 0 4-4m-4 4-4-4M5 20h14"/></svg> <span>יצוא נתונים</span></button><label class="toolbar-button wide file-label"><svg aria-hidden="true" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M12 17V5m0 0 4 4m-4-4-4 4M5 20h14"/></svg> <span>יבוא נתונים</span><input id="importData" type="file" accept="application/json,.json" hidden></label><p id="importExportStatus" class="import-export-status"></p></div></section></div>
  <script src="./code/js/cube2x2.js?v=20260824-4"></script><script src="./code/js/scramble2x2.js?v=20260824-4"></script><script src="./code/js/app.js?v=20260824-4"></script><script src="./code/js/settings.js?v=20260824-4"></script><script src="./code/js/import-export.js?v=20260824-4"></script><script src="./code/js/hebrew-i18n-fixes.js?v=20260824-4"></script>
</body></html>
