name: SSC Scramble Full Regression

on:
  push:
    branches:
      - phase5-scramble-full-regression
    paths:
      - 'index.html'
      - 'sw.js'
      - 'code/js/app.js'
      - 'code/js/scramble-provider.js'
      - 'code/js/scramble-production-bridge.js'
      - 'code/js/scramble-generators.js'
      - 'code/js/scramble-history.js'
      - 'code/js/training.js'
      - 'code/js/training-data.js'
      - 'code/js/settings.js'
      - 'code/js/advanced-features.js'
      - 'code/js/preview/**'
      - 'code/js/preview-integration.js'
      - 'code/js/preview-sizing.js'
      - 'code/js/preview-visibility-hotfix.js'
      - 'code/js/wca-previews.js'
      - 'tests/scramble-*.mjs'
      - 'tests/preview-*.mjs'
      - '.github/workflows/scramble-full-regression.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'sw.js'
      - 'code/js/app.js'
      - 'code/js/scramble-provider.js'
      - 'code/js/scramble-production-bridge.js'
      - 'code/js/scramble-generators.js'
      - 'code/js/scramble-history.js'
      - 'code/js/training.js'
      - 'code/js/training-data.js'
      - 'code/js/settings.js'
      - 'code/js/advanced-features.js'
      - 'code/js/preview/**'
      - 'code/js/preview-integration.js'
      - 'code/js/preview-sizing.js'
      - 'code/js/preview-visibility-hotfix.js'
      - 'code/js/wca-previews.js'
      - 'tests/scramble-*.mjs'
      - 'tests/preview-*.mjs'
      - '.github/workflows/scramble-full-regression.yml'

jobs:
  full-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install regression dependencies
        run: npm install --no-save --no-package-lock cubing@0.63.4 jsdom@26.1.0

      - name: Phase 5 full SSC scramble regression
        run: node tests/scramble-full-regression.mjs
      - name: Phase 5 preserved non-NxN generators
        run: node tests/scramble-legacy-events-validation.mjs
      - name: Phase 5 PWA scramble assets
        run: node tests/scramble-pwa-validation.mjs

      - name: Revalidate Phase 4 production integration
        run: node tests/scramble-production-integration.mjs
      - name: Revalidate Phase 3 600 NxN Provider scrambles
        run: node tests/scramble-provider-validation.mjs
      - name: Revalidate Phase 3 forced Provider fallback
        run: node tests/scramble-provider-fallback-validation.mjs

      - name: Revalidate Preview state against cubing.js
        run: node tests/preview-validation.mjs
      - name: Revalidate Preview SVG geometry
        run: node tests/preview-rendering.mjs
      - name: Revalidate Preview production routing
        run: node tests/preview-integration.mjs
