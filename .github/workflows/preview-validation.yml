name: SSC Preview Validation

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'code/css/minimal-competition.css'
      - 'code/css/app-enhancements.css'
      - 'code/css/cube-preview.css'
      - 'code/css/ssc-preview-v1.css'
      - 'code/js/preview/**'
      - 'code/js/preview-sizing.js'
      - 'code/js/preview-integration.js'
      - 'code/js/preview-manager.js'
      - 'code/js/wca-previews.js'
      - 'code/js/scramble-generators.js'
      - 'code/js/scramble2x2.js'
      - 'code/js/app.js'
      - 'code/js/advanced-features.js'
      - 'code/js/import-export.js'
      - 'code/js/settings.js'
      - 'code/js/scramble-history.js'
      - 'tests/preview-*.mjs'
      - 'tests/scramble-*.mjs'
      - 'tests/ui-*.mjs'
      - '.github/workflows/preview-validation.yml'
  pull_request:
    paths:
      - 'index.html'
      - 'code/css/minimal-competition.css'
      - 'code/css/app-enhancements.css'
      - 'code/css/cube-preview.css'
      - 'code/css/ssc-preview-v1.css'
      - 'code/js/preview/**'
      - 'code/js/preview-sizing.js'
      - 'code/js/preview-integration.js'
      - 'code/js/preview-manager.js'
      - 'code/js/wca-previews.js'
      - 'code/js/scramble-generators.js'
      - 'code/js/scramble2x2.js'
      - 'code/js/app.js'
      - 'code/js/advanced-features.js'
      - 'code/js/import-export.js'
      - 'code/js/settings.js'
      - 'code/js/scramble-history.js'
      - 'tests/preview-*.mjs'
      - 'tests/scramble-*.mjs'
      - 'tests/ui-*.mjs'
      - '.github/workflows/preview-validation.yml'

jobs:
  validate-preview-state:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install validation dependencies
        run: npm install --no-save --no-package-lock cubing@0.63.4 jsdom@26.1.0
      - name: Validate 600 NxN scramble generations
        run: node tests/scramble-validation.mjs
      - name: Validate forced NxN legacy fallback
        run: node tests/scramble-fallback.mjs
      - name: Validate NxN timer/history/repeat integration
        run: node tests/scramble-app-integration.mjs
      - name: Validate SSC state against cubing.js
        run: node tests/preview-validation.mjs
      - name: Validate SVG rendering geometry
        run: node tests/preview-rendering.mjs
      - name: Validate 6x6 and 7x7 preview bridge
        run: node tests/preview-high-order-integration.mjs
      - name: Validate FMC, 3BLD and OH 3x3 preview routing
        run: node tests/preview-333-derived-events.mjs
      - name: Validate real 3BLD scrambles in native preview
        run: node tests/preview-3bld-production.mjs
      - name: Validate pixel-perfect preview centering
        run: node tests/preview-centering.mjs
      - name: Validate cube line-width settings
        run: node tests/preview-line-width.mjs
      - name: Validate production integration and fallback
        run: node tests/preview-integration.mjs
      - name: Validate UI regressions
        run: for test in tests/ui-*.mjs; do node "$test"; done
